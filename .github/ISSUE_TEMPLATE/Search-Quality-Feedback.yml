name: Search Quality Feedback
description: Submit feedback about search result quality
title: "[Search Quality Feedback] "
labels: ["search-quality"]
body:
  - type: markdown
    attributes:
      value: |
        在仓库中提交搜索质量反馈，请填写下面信息。
        Please fill out the form to submit search quality feedback.

  - type: input
    id: title
    attributes:
      label: Add a title
      description: Briefly summarize your search issue
      placeholder: e.g. Keyword returns irrelevant results
    validations:
      required: true

  - type: textarea
    id: query
    attributes:
      label: Search Query
      description: What search query did you use?｜你使用了什么搜索关键词？
      placeholder: Leave a comment
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: What's wrong with the search results?｜搜索结果存在什么问题？
      placeholder: Leave a comment
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What result did you expect to see?｜你期望看到什么样的搜索结果？
      placeholder: Leave a comment

  - type: textarea
    id: evidence
    attributes:
      label: Evidence & Screenshots
      description: Add screenshots, result links, raw search response to help us diagnose.｜添加截图、结果链接、原始搜索返回内容，方便我们定位问题
      placeholder: Leave a comment

  - type: dropdown
    id: problem_type
    attributes:
      label: Problem Type
      description: Type of search quality issue｜搜索问题类型
      options:
        - None 无
        - Irrelevant results 结果不相关
        - Missing content 目标内容缺失
        - Wrong ranking 排序错误
        - Outdated information 
