name: Bug Report
description: Create a report to help us reproduce and fix bugs
title: "[Bug Report] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        在仓库中提交bug反馈，请填写下面信息。
        Please fill out the form to submit bug report.
        Please do not include API keys, access tokens, or other sensitive information.
        请勿提交 API Key、Access Token 或其他敏感信息。
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened, including any error messages or unexpected behavior.｜描述实际发生的问题，包括错误信息或异常现象。
      placeholder: Leave a comment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce this issue｜复现该问题的操作步骤
      placeholder: Leave a comment
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      description: How are you using AnySearch?｜你是如何使用 AnySearch 的？(单选)
      options:
        - API
        - MCP
        - Skill
        - Third-party integration
        - Other
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Screenshots, logs or other related information｜截图、日志或其他相关信息
      placeholder: Leave a comment
