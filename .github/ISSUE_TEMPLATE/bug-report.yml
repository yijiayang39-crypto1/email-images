name: Bug Report
description: Create a report to help us reproduce and fix bugs
title: "[Bug Report] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the form to submit bug report.
        Please do not include API keys or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: What happened？
      description: Describe the issue you encountered, including any error messages or unexpected behavior.｜请描述你遇到的问题，包括错误信息或异常现象。
      placeholder: Leave a comment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide the steps needed to reproduce the issue.｜请提供能复现该问题的操作步骤。
      placeholder: Leave a comment
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: How are you using AnySearch?
      description: How are you using AnySearch?｜你是如何使用 AnySearch 的？
      options:
        - API
        - MCP
        - Skill
        - Third-party integration
        - Other
    validations:
      required: true
  - type: textarea
    id: request_details
    attributes:
      label: Request Details
      description: Please provide relevant details, such as endpoint, request ID, request time, version, or agent/framework.｜请提供相关信息，例如 Endpoint、Request ID、请求时间、版本或 Agent / Framework。
      placeholder: Leave a comment
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any relevant queries, screenshots, or other related information.｜可补充相关Query、截图或其他相关信息
      placeholder: Leave a comment
