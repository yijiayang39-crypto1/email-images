name: Feature Request
description: Suggest an idea for this project
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        在仓库中提交功能需求，请填写下面信息。
        Please fill out the form to submit feature request.

  - type: input
    id: title
    attributes:
      label: Add a title
      description: Briefly summarize your feature request｜简要描述这个功能需求
      placeholder: e.g. Support export search result as csv
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like?｜你想要什么功能？
      placeholder: Leave a comment
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Why is this needed? What problem does it solve?｜为什么需要这个功能，可以解决什么问题？
      placeholder: Leave a comment
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of this project does this relate to?｜该需求属于项目哪个模块？
      options:
        - Tools
        - MCP servers
        - Extensions / Plugins
        - Skills / Commands
        - Configuration
        - Other

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: How would you implement this? Link to relevant docs or APIs if applicable.｜你设想如何实现？如有相关文档/API可以附上链接。
      placeholder: Leave a comment

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or other approaches you've tried?｜你是否尝试过其他替代方案或临时办法？
      placeholder: Leave a comment
