name: Feature Request
description: Suggest an idea for this project
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve AnySearch. Tell us what you'd like to see and how it would help your use case.
  - type: textarea
    id: description
    attributes:
      label: Feature Request
      description: What would you like AnySearch to support or improve?｜你希望 AnySearch 新增或改进什么能力？
      placeholder: Leave a comment
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What are you trying to achieve, and how would this feature help?｜你希望完成什么任务？这个功能可以解决什么问题？
      placeholder: Leave a comment
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of this project does this relate to?｜该需求属于项目哪个模块？
      options:
        - Web Search
        - Vertical Search
        - Extract
        - API
        - MCP
        - Skill
        - Integrations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: If you have an idea for how this feature could work, feel free to share it. Links, examples, or references are welcome.｜如果你对这个功能如何实现或使用有想法，欢迎补充，也可以附上示例、文档或参考链接。
      placeholder: Leave a comment
